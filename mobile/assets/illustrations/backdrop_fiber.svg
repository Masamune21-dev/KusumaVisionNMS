    <circle cx="330" cy="80" r="1"/><circle cx="360" cy="80" r="1"/><circle cx="330" cy="100" r="1"/><circle cx="360" cy="100" r="1"/><circle cx="390" cy="80" r="1"/><circle cx="390" cy="100" r="1"/>
