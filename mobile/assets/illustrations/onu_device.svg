<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" fill="none">
  <!-- Perangkat ONU/ONT tampak depan. Lampu PWR/PON/LOS TIDAK digambar di sini —
       aplikasi menumpuknya sebagai widget di (110,85) (133,85) (156,85) supaya
       warnanya mengikuti status ONU dan bisa berkedip. -->
