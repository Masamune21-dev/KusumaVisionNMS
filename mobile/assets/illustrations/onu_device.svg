  <path d="M0 116 C 10 116, 8 92, 22 92" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Badan -->
  <rect x="20" y="46" width="160" height="58" rx="13" fill="#17233C" stroke="#2A3B5C" stroke-width="2"/>
  <rect x="26" y="51" width="148" height="6" rx="3" fill="#1B2A46"/>
