  <!-- Antena -->
  <rect x="42" y="6" width="9" height="46" rx="4.5" fill="#1B2A46" stroke="#2A3B5C" stroke-width="2"/>
  <rect x="149" y="6" width="9" height="46" rx="4.5" fill="#1B2A46" stroke="#2A3B5C" stroke-width="2"/>
  <!-- Kabel fiber masuk dari kiri -->
