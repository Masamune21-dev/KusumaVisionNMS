<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Pola header: serat optik menyapu dari pojok kanan-atas. Sengaja HANYA di
       sisi kanan (x > 190) supaya area angka & teks di kiri-tengah header bersih.
       Satu warna (#22D3EE) — aplikasi mewarnainya putih lewat ColorFilter. -->
  <g stroke="#22D3EE" stroke-linecap="round">
    <path d="M200 -10 C 250 40, 320 60, 410 70" stroke-width="1.4" stroke-opacity=".6"/>
    <path d="M250 -10 C 290 60, 340 110, 410 130" stroke-width="1.2" stroke-opacity=".45"/>
    <path d="M310 -10 C 330 70, 370 150, 410 190" stroke-width="1.1" stroke-opacity=".35"/>
    <path d="M360 -10 C 368 80, 390 190, 410 250" stroke-width="1" stroke-opacity=".25"/>
    <path d="M320 58 C 350 95, 380 115, 410 110" stroke-width=".9" stroke-opacity=".3" stroke-dasharray="3 5"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="320" cy="58" r="3.2" fill-opacity=".8"/>
    <circle cx="320" cy="58" r="8" fill-opacity=".12"/>
    <circle cx="352" cy="118" r="2.4" fill-opacity=".6"/>
    <circle cx="384" cy="196" r="2.2" fill-opacity=".45"/>
    <circle cx="262" cy="30" r="2" fill-opacity=".5"/>
  </g>
  <g fill="#22D3EE" fill-opacity=".2">
    <circle cx="300" cy="150" r="1"/><circle cx="325" cy="150" r="1"/><circle cx="350" cy="150" r="1"/>
    <circle cx="300" cy="170" r="1"/><circle cx="325" cy="170" r="1"/><circle cx="350" cy="170" r="1"/>
    <circle cx="370" cy="40" r="1"/><circle cx="390" cy="40" r="1"/><circle cx="370" cy="20" r="1"/><circle cx="390" cy="20" r="1"/>
  </g>
</svg>
