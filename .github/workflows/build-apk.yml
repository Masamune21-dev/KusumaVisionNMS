name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Alamat API NMS (contoh: https://nms.domain/api/v1)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL || vars.API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate API_BASE_URL
        run: |
          if [[ ! "$API_BASE_URL" =~ ^https?://[^/]+ ]]; then
            echo "ERROR: set repository secret/variable API_BASE_URL or workflow input api_base_url" >&2
            exit 1
          fi

      - name: Decode signing keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/upload-keystore.jks
          cat > mobile/android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/mobile/android/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Decode google-services.json (optional)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > mobile/android/app/google-services.json

      - name: Build APK
        run: bash bin/build-apk.sh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kusumavision-nms-apk
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            public/downloads/*.apk
          if-no-files-found: error
          retention-days: 30